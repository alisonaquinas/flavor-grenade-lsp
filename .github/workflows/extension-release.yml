name: Extension Release

on:
  push:
    tags:
      - 'ext-v*'

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.13'

jobs:
  release-gate:
    name: Extension Release Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}

      - name: Install server dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci --ignore-scripts

      - name: Compile extension
        working-directory: extension
        run: npm run compile

      - name: Run extension selector-proof tests
        working-directory: extension
        run: npm test

      - name: Verify Marketplace selector proof
        working-directory: extension
        run: npm run verify:marketplace-assets

      - name: Verify package target rules
        working-directory: extension
        run: npm run verify:package-targets

      - name: Run extension host selector-proof tests
        working-directory: extension
        run: xvfb-run -a npm run test:host

  build:
    name: Build Marketplace VSIX
    runs-on: ubuntu-latest
    needs: release-gate
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true

      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install server dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci --ignore-scripts

      - name: Build extension client and bundled JS server
        working-directory: extension
        run: npm run compile

      - name: Verify extension icon is a PNG
        working-directory: extension
        run: |
          signature="$(head -c 8 images/icon.png | od -An -tx1 | tr -d ' \n')"
          test "$signature" = "89504e470d0a1a0a"

      - name: Package VSIX
        working-directory: extension
        run: npx vsce package

      - name: Inspect packaged server payload
        working-directory: extension
        run: |
          set -euo pipefail
          vsix="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix"

          node --import tsx test/package-targets/server-binary.ts \
            --vsix "$vsix"

          if zipinfo -1 "$vsix" | grep -E '\.vsix$'; then
            echo "Nested VSIX found in package." >&2
            exit 1
          fi

      - name: Generate VSIX checksums
        working-directory: extension
        run: sha256sum ./*.vsix > checksums.sha256

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: |
            extension/*.vsix
            extension/checksums.sha256
          if-no-files-found: error

  attest:
    name: Attest VSIX Provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: vsix-artifacts
          name: vsix
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: vsix-artifacts/*.vsix

  smoke-test-bundled-server:
    name: Smoke Test Bundled JS Server
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: vsix-artifact

      - name: Run bundled JS server
        run: |
          set -euo pipefail
          vsix="$(find vsix-artifact -name '*.vsix' -print -quit)"
          test -n "$vsix"
          unzip -q "$vsix" -d vsix-extracted
          server="vsix-extracted/extension/server/main.js"
          test -f "$server"
          timeout 5s node "$server" >/tmp/flavor-grenade-server.out 2>/tmp/flavor-grenade-server.err || status=$?
          status="${status:-0}"
          if [ "$status" -eq 124 ]; then
            echo "Server stayed alive waiting for LSP input."
            exit 0
          fi
          cat /tmp/flavor-grenade-server.out
          cat /tmp/flavor-grenade-server.err >&2
          exit "$status"

  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    needs: [release-gate, build, attest, smoke-test-bundled-server]
    environment: vsce-publish
    permissions:
      contents: read
    env:
      VSCE_PUBLISHER_NAME: ${{ vars.VSCE_PUBLISHER_NAME }}
      VSCE_PUBLISHER_PAT: ${{ secrets.VSCE_PUBLISHER_PAT }}
      VSCE_STORE: file
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: vsix-artifacts
          name: vsix
          merge-multiple: true

      - name: Verify VSIX checksums
        working-directory: vsix-artifacts
        run: |
          sha256sum --check checksums.sha256

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install vsce
        run: npm install -g @vscode/vsce@3.9.1 --ignore-scripts

      - name: Verify Marketplace publisher token
        if: ${{ !contains(github.ref_name, '-test') }}
        timeout-minutes: 1
        continue-on-error: true
        run: vsce verify-pat "$VSCE_PUBLISHER_NAME" --pat "$VSCE_PUBLISHER_PAT"

      - name: Log in to Marketplace publisher
        if: ${{ !contains(github.ref_name, '-test') }}
        run: |
          mkdir -p "$RUNNER_TEMP/vsce-home"
          HOME="$RUNNER_TEMP/vsce-home" node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');

          const publisherName = process.env.VSCE_PUBLISHER_NAME;
          const pat = process.env.VSCE_PUBLISHER_PAT;
          if (!publisherName || !pat) {
            throw new Error('Missing VSCE publisher credentials.');
          }

          writeFileSync(join(process.env.HOME, '.vsce'), JSON.stringify({
            publishers: [{ name: publisherName, pat }],
          }), { mode: 0o600 });
          NODE

      - name: Skip Marketplace publish for test tag
        if: ${{ contains(github.ref_name, '-test') }}
        run: echo "vsce publish has no dry-run flag in @vscode/vsce 3.9.1; build, package, checksum, and attestation steps completed."

      - name: Publish all VSIXs
        if: ${{ !contains(github.ref_name, '-test') }}
        run: HOME="$RUNNER_TEMP/vsce-home" vsce publish --packagePath vsix-artifacts/*.vsix
