name: Extension Release

on:
  push:
    tags:
      - 'ext-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build VSIX (${{ matrix.vsce-target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - vsce-target: linux-x64
            bun-target: bun-linux-x64
            binary-name: flavor-grenade-lsp
          - vsce-target: linux-arm64
            bun-target: bun-linux-arm64
            binary-name: flavor-grenade-lsp
          - vsce-target: alpine-x64
            bun-target: bun-linux-x64-musl
            binary-name: flavor-grenade-lsp
          - vsce-target: darwin-x64
            bun-target: bun-darwin-x64
            binary-name: flavor-grenade-lsp
          - vsce-target: darwin-arm64
            bun-target: bun-darwin-arm64
            binary-name: flavor-grenade-lsp
          - vsce-target: win32-x64
            bun-target: bun-windows-x64
            binary-name: flavor-grenade-lsp.exe
          - vsce-target: win32-arm64
            bun-target: bun-windows-arm64
            binary-name: flavor-grenade-lsp.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Cross-compile server binary
        run: >
          node scripts/build-binary.mjs
          --target=${{ matrix.bun-target }}
          --outfile=extension/server/${{ matrix.binary-name }}
          --minify

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension client
        working-directory: extension
        run: npm run build:extension

      - name: Verify extension icon is a PNG
        working-directory: extension
        run: |
          signature="$(head -c 8 images/icon.png | od -An -tx1 | tr -d ' \n')"
          test "$signature" = "89504e470d0a1a0a"

      - name: Package VSIX
        working-directory: extension
        run: npx vsce package --target ${{ matrix.vsce-target }}

      - name: Generate VSIX checksums
        working-directory: extension
        run: sha256sum *.vsix > checksums-${{ matrix.vsce-target }}.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: extension/*.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix-${{ matrix.vsce-target }}
          path: |
            extension/*.vsix
            extension/checksums-*.sha256
          if-no-files-found: error

  smoke-test-windows-binary:
    name: Smoke Test Windows Binary
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix-win32-x64
          path: vsix-artifact

      - name: Run bundled Windows server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsix = Get-ChildItem -Path vsix-artifact -Filter '*.vsix' | Select-Object -First 1
          if ($null -eq $vsix) {
            throw 'No win32-x64 VSIX artifact found.'
          }

          $extractDir = Join-Path $PWD 'vsix-extracted'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($vsix.FullName, $extractDir)

          $server = Join-Path $extractDir 'extension/server/flavor-grenade-lsp.exe'
          if (!(Test-Path $server)) {
            throw "Bundled server not found: $server"
          }

          $stdout = Join-Path $PWD 'server.stdout.txt'
          $stderr = Join-Path $PWD 'server.stderr.txt'
          $process = Start-Process `
            -FilePath $server `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr

          if (!$process.WaitForExit(5000)) {
            Stop-Process -Id $process.Id -Force
            Write-Host 'Server stayed alive waiting for LSP input.'
            exit 0
          }

          if ($process.ExitCode -ne 0) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Server exited with code $($process.ExitCode)."
          }

  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    needs: [build, smoke-test-windows-binary]
    environment: vsce-publish
    permissions:
      contents: read
    env:
      VSCE_PUBLISHER_NAME: ${{ vars.VSCE_PUBLISHER_NAME }}
      VSCE_PUBLISHER_PAT: ${{ secrets.VSCE_PUBLISHER_PAT }}
      VSCE_STORE: file
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: vsix-artifacts
          pattern: vsix-*
          merge-multiple: true

      - name: Verify VSIX checksums
        working-directory: vsix-artifacts
        run: |
          cat checksums-*.sha256 > all-checksums.sha256
          sha256sum --check all-checksums.sha256

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install vsce
        run: npm install -g @vscode/vsce@3.9.1

      - name: Verify Marketplace publisher token
        if: ${{ !contains(github.ref_name, '-test') }}
        run: vsce verify-pat "$VSCE_PUBLISHER_NAME" --pat "$VSCE_PUBLISHER_PAT"

      - name: Log in to Marketplace publisher
        if: ${{ !contains(github.ref_name, '-test') }}
        run: |
          mkdir -p "$RUNNER_TEMP/vsce-home"
          HOME="$RUNNER_TEMP/vsce-home" node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');

          const publisherName = process.env.VSCE_PUBLISHER_NAME;
          const pat = process.env.VSCE_PUBLISHER_PAT;
          if (!publisherName || !pat) {
            throw new Error('Missing VSCE publisher credentials.');
          }

          writeFileSync(join(process.env.HOME, '.vsce'), JSON.stringify({
            publishers: [{ name: publisherName, pat }],
          }), { mode: 0o600 });
          NODE

      - name: Skip Marketplace publish for test tag
        if: ${{ contains(github.ref_name, '-test') }}
        run: echo "vsce publish has no dry-run flag in @vscode/vsce 3.9.1; build, package, checksum, and attestation steps completed."

      - name: Publish all VSIXs
        if: ${{ !contains(github.ref_name, '-test') }}
        run: HOME="$RUNNER_TEMP/vsce-home" vsce publish --packagePath vsix-artifacts/*.vsix
