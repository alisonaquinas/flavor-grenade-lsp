name: Security SAST

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: python3 -m pip install --user semgrep==1.163.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/javascript \
            --error \
            --sarif \
            --output semgrep.sarif \
            --exclude node_modules \
            --exclude extension/node_modules \
            --exclude website/node_modules \
            --exclude coverage \
            --exclude dist \
            --exclude extension/dist \
            --exclude extension/server \
            --exclude website/dist \
            .

      - name: Print Semgrep findings
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path('semgrep.sarif')
          if not sarif_path.exists():
              print('semgrep.sarif was not produced')
              raise SystemExit(0)

          sarif = json.loads(sarif_path.read_text(encoding='utf-8'))
          results = sarif.get('runs', [{}])[0].get('results', [])
          if not results:
              print('No Semgrep SARIF results found')
              raise SystemExit(0)

          for result in results:
              location = result.get('locations', [{}])[0].get('physicalLocation', {})
              artifact = location.get('artifactLocation', {})
              region = location.get('region', {})
              message = result.get('message', {}).get('text', '').replace('\n', ' ')
              print(
                  f"{artifact.get('uri', '<unknown>')}:{region.get('startLine', '?')}: "
                  f"{result.get('ruleId', '<unknown-rule>')}: {message}"
              )
          PY

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

      - name: Run actionlint
        run: ./actionlint -color

      - name: Install zizmor
        run: python3 -m pip install --user zizmor==1.25.2

      - name: Generate zizmor SARIF
        run: zizmor --offline --format=sarif . > zizmor.sarif

      - name: Run blocking zizmor audit
        run: zizmor --offline --persona=auditor --min-severity=medium --min-confidence=medium .

      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$install_dir"
          curl -fsSLo "${install_dir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "${install_dir}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "${install_dir}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | (cd "$install_dir" && sha256sum -c -)
          tar -xzf "${install_dir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$install_dir"

      - name: Run Gitleaks
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" dir . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --no-banner

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: '2.3.8'
        run: |
          curl -fsSLO "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          curl -fsSLO "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_SHA256SUMS"
          grep "osv-scanner_linux_amd64" osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          mv osv-scanner_linux_amd64 osv-scanner

      - name: Run OSV-Scanner
        run: |
          ./osv-scanner scan \
            --lockfile bun.lock \
            --lockfile extension/package-lock.json \
            --lockfile website/package-lock.json \
            --format sarif \
            --output-file osv-scanner.sarif

      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner
