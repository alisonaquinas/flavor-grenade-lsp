name: Website S3

on:
  push:
    tags:
      - 'site-v*.*.*'
      - 'site-v*.*.*-test*'

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify website release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true

      - name: Release mode
        run: |
          if [[ "$GITHUB_REF_NAME" == *-test* ]]; then
            echo "RELEASE_MODE=test" >> "$GITHUB_ENV"
            echo "Release mode: test"
          else
            echo "RELEASE_MODE=production" >> "$GITHUB_ENV"
            echo "Release mode: production"
          fi

      - name: Validate website release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^site-v[0-9]+\.[0-9]+\.[0-9]+(-test(\.[0-9]+)?)?$ ]]; then
            echo "Invalid website release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify production tag commit is on main
        if: ${{ !contains(github.ref_name, '-test') }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Lint website
        run: npm run lint
        working-directory: website

      - name: Typecheck website
        run: npm run typecheck
        working-directory: website

      - name: Test website
        run: npm test
        working-directory: website

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          WEBSITE_BASE: ${{ vars.WEBSITE_BASE_URL_PATH || '/' }}

      - name: Smoke production build
        run: |
          mkdir -p website/release-evidence
          test -f website/dist/index.html
          test -f website/dist/sitemap.xml
          test -f website/dist/robots.txt
          grep -qi "Flavor Grenade LSP" website/dist/index.html
          grep -q "/quickstart/" website/dist/sitemap.xml
          grep -q "Sitemap:" website/dist/robots.txt
          grep -R "marketplace.visualstudio.com/items?itemName=alisonaquinas.flavor-grenade-lsp" website/src/content website/dist > website/release-evidence/marketplace-link.txt
          if grep -R "git-lfs.github.com/spec/v1" website/dist/assets; then
            echo "Website dist contains Git LFS pointer files instead of image bytes." >&2
            exit 1
          fi
          {
            echo "# Website release smoke evidence"
            echo ""
            echo "- Release mode: ${RELEASE_MODE}"
            echo "- homepage: website/dist/index.html"
            echo "- quickstart: sitemap contains /quickstart/"
            echo "- sitemap.xml: website/dist/sitemap.xml"
            echo "- robots.txt: website/dist/robots.txt"
            echo "- Marketplace link: marketplace.visualstudio.com/items?itemName=alisonaquinas.flavor-grenade-lsp"
          } > website/release-evidence/website-release-summary.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-dist
          path: website/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-release-evidence
          path: website/release-evidence/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy website to AWS S3
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.ref_name, '-test') }}
    environment:
      name: website-production
      url: ${{ vars.WEBSITE_PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website-dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_WEBSITE_DEPLOY_ROLE_ARN }}
          role-session-name: website-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Sync immutable website assets
        run: |
          if [ -d website-dist/assets ]; then
            aws s3 sync website-dist/assets "s3://${AWS_WEBSITE_BUCKET}/assets" \
              --delete \
              --only-show-errors \
              --cache-control "public,max-age=31536000,immutable"
          fi
        env:
          AWS_WEBSITE_BUCKET: ${{ vars.AWS_WEBSITE_BUCKET }}

      - name: Sync website HTML and metadata
        run: |
          aws s3 sync website-dist "s3://${AWS_WEBSITE_BUCKET}" \
            --delete \
            --only-show-errors \
            --exclude "assets/*" \
            --cache-control "public,max-age=300,must-revalidate"
        env:
          AWS_WEBSITE_BUCKET: ${{ vars.AWS_WEBSITE_BUCKET }}

      - name: Publish clean URL route objects
        run: |
          node <<'NODE' > /tmp/website-route-objects.txt
          const { readFileSync } = require('node:fs');

          const sitemap = readFileSync('website-dist/sitemap.xml', 'utf8');
          const routes = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)]
            .map((match) => new URL(match[1]).pathname)
            .filter((pathname) => pathname !== '/' && pathname.endsWith('/'))
            .map((pathname) => pathname.slice(1, -1));

          for (const key of [...new Set(routes)].sort()) {
            process.stdout.write(`${key}\t${key}/index.html\n`);
            process.stdout.write(`${key}/\t${key}/index.html\n`);
          }
          NODE

          while IFS=$'\t' read -r route_key route_index; do
            if [ ! -f "website-dist/${route_index}" ]; then
              echo "Missing prerendered route HTML: website-dist/${route_index}" >&2
              exit 1
            fi

            aws s3api put-object \
              --bucket "$AWS_WEBSITE_BUCKET" \
              --key "$route_key" \
              --body "website-dist/${route_index}" \
              --content-type "text/html" \
              --cache-control "public,max-age=300,must-revalidate" \
              >/dev/null
          done < /tmp/website-route-objects.txt
        env:
          AWS_WEBSITE_BUCKET: ${{ vars.AWS_WEBSITE_BUCKET }}

      - name: Invalidate CloudFront
        if: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
