name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*.*.*-test*'

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: flavor-grenade-lsp
            script: build:binary
          - os: macos-latest
            target: darwin-arm64
            binary: flavor-grenade-lsp
            script: build:binary
          - os: macos-15-intel
            target: darwin-x64
            binary: flavor-grenade-lsp
            script: build:binary
          - os: windows-latest
            target: win-x64
            binary: flavor-grenade-lsp.exe
            script: build:binary:win

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build binary
        run: bun run ${{ matrix.script }}

      - name: Rename binary with target suffix
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            mv dist/${{ matrix.binary }} dist/flavor-grenade-lsp-${{ matrix.target }}.exe
          else
            mv dist/${{ matrix.binary }} dist/flavor-grenade-lsp-${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/flavor-grenade-lsp-${{ matrix.target }}*

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-test* ]]; then
            args+=(--draft --prerelease --latest=false)
          else
            args+=(--latest=true)
          fi
          gh release create "$GITHUB_REF_NAME" dist/flavor-grenade-lsp-* "${args[@]}"

  # npm publishing is handled by the CI workflow's gated publish job, which
  # runs after typecheck/lint/test/build pass and uses OIDC trusted publishing.
  # A separate publish step here would race with that job and fail with E403
  # on whichever runs second.
