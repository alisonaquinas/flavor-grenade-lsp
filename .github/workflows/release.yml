name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.13'
  COSIGN_VERSION: '3.0.6'

jobs:
  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: flavor-grenade-lsp
            script: build:binary
          - os: macos-latest
            target: darwin-arm64
            binary: flavor-grenade-lsp
            script: build:binary
          - os: macos-15-intel
            target: darwin-x64
            binary: flavor-grenade-lsp
            script: build:binary
          - os: windows-latest
            target: win-x64
            binary: flavor-grenade-lsp.exe
            script: build:binary:win

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build binary
        run: bun run ${{ matrix.script }}

      - name: Rename binary with target suffix
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            mv dist/${{ matrix.binary }} dist/flavor-grenade-lsp-${{ matrix.target }}.exe
          else
            mv dist/${{ matrix.binary }} dist/flavor-grenade-lsp-${{ matrix.target }}
          fi

      - name: Install cosign
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="cosign-linux-amd64"; binary="cosign" ;;
            macOS-X64) asset="cosign-darwin-amd64"; binary="cosign" ;;
            macOS-ARM64) asset="cosign-darwin-arm64"; binary="cosign" ;;
            Windows-X64) asset="cosign-windows-amd64.exe"; binary="cosign.exe" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          install_dir="${RUNNER_TEMP}/cosign"
          mkdir -p "$install_dir"
          base_url="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSLo "${install_dir}/${binary}" "${base_url}/${asset}"
          curl -fsSLo "${install_dir}/cosign_checksums.txt" "${base_url}/cosign_checksums.txt"
          expected_sha256="$(grep "  ${asset}$" "${install_dir}/cosign_checksums.txt" | awk '{print $1}')"
          actual_sha256="$(COSIGN_BINARY="${install_dir}/${binary}" node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); console.log(crypto.createHash("sha256").update(fs.readFileSync(process.env.COSIGN_BINARY)).digest("hex"));')"
          test "$expected_sha256" = "$actual_sha256"
          chmod +x "${install_dir}/${binary}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Sign binary with GitHub OIDC
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            binary_path="dist/flavor-grenade-lsp-${{ matrix.target }}.exe"
          else
            binary_path="dist/flavor-grenade-lsp-${{ matrix.target }}"
          fi

          bundle_path="${binary_path}.sigstore.json"
          cosign sign-blob "$binary_path" \
            --bundle "$bundle_path" \
            --yes

          cosign verify-blob "$binary_path" \
            --bundle "$bundle_path" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/flavor-grenade-lsp-${{ matrix.target }}*

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-test* ]]; then
            args+=(--draft --prerelease --latest=false)
          else
            args+=(--latest=true)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/flavor-grenade-lsp-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/flavor-grenade-lsp-* "${args[@]}"
          fi

  # npm publishing is handled by the CI workflow's gated publish job, which
  # runs after typecheck/lint/test/build pass and uses OIDC trusted publishing.
  # A separate publish step here would race with that job and fail with E403
  # on whichever runs second.

  verify-plugin-runtime-consumption:
    name: Verify plugin runtime consumption (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, darwin-arm64, darwin-x64, win-x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install cosign
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="cosign-linux-amd64"; binary="cosign" ;;
            macOS-X64) asset="cosign-darwin-amd64"; binary="cosign" ;;
            macOS-ARM64) asset="cosign-darwin-arm64"; binary="cosign" ;;
            Windows-X64) asset="cosign-windows-amd64.exe"; binary="cosign.exe" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          install_dir="${RUNNER_TEMP}/cosign"
          mkdir -p "$install_dir"
          base_url="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSLo "${install_dir}/${binary}" "${base_url}/${asset}"
          curl -fsSLo "${install_dir}/cosign_checksums.txt" "${base_url}/cosign_checksums.txt"
          expected_sha256="$(grep "  ${asset}$" "${install_dir}/cosign_checksums.txt" | awk '{print $1}')"
          actual_sha256="$(COSIGN_BINARY="${install_dir}/${binary}" node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); console.log(crypto.createHash("sha256").update(fs.readFileSync(process.env.COSIGN_BINARY)).digest("hex"));')"
          test "$expected_sha256" = "$actual_sha256"
          chmod +x "${install_dir}/${binary}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Fetch signed runtime from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run skill:fetch-runtime -- \
            --target "${{ matrix.target }}" \
            --server-release "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}"

      - name: Set plugin version for consumption check
        run: bun run skill:set-version -- "0.0.0-runtime-check" --server-version "${GITHUB_REF_NAME#v}" --server-release-tag "$GITHUB_REF_NAME"

      - name: Package and verify plugin artifact
        run: |
          package_root="$(bun run skill:package -- --dry-run --require-signed-runtime --target ${{ matrix.target }} | tail -n 1)"
          node scripts/skill-verify.mjs --skill-root "$package_root/skills/flavorgrenade-lsp"
          echo "$package_root" > build/skill-artifacts/package-root-${{ matrix.target }}.txt

      - name: Upload plugin runtime consumption evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-runtime-consumption-${{ matrix.target }}
          path: |
            build/skill-artifacts/package-root-${{ matrix.target }}.txt
            build/skill-artifacts/*/package-report.json
          if-no-files-found: error
