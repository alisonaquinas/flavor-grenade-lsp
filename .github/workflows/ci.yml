name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

# Minimal permissions — CI only reads the repository.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # tsc --noEmit; fails on any type error.
      - run: bun run typecheck

  lint:
    name: Lint (ESLint, zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # The lint script must pass --max-warnings 0 so any warning is a failure.
      - run: bun run lint

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run lint:dependencies

  format:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # format:check runs `prettier --check` — exits non-zero if any file differs.
      - run: bun run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # --coverage writes to coverage/ which is uploaded as an artifact below.
      - run: bun test --coverage

      # Upload coverage even on failure so we can inspect partial results.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage/

  bdd:
    name: BDD scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run bdd

  build:
    name: Build
    runs-on: ubuntu-latest
    # Only build if type check, lint, and tests all pass. Format is independent
    # of the build output so it does not gate here.
    needs: [typecheck, lint, dependency-policy, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run build

  markdown-lint-docs:
    name: Markdown lint (OFM docs — markdownlint-obsidian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # markdownlint-obsidian enforces Obsidian Flavored Markdown conventions
      # defined in .obsidian-linter.jsonc, including wikilink/embed resolution.
      # Applied to docs/ and website/docs/ — other Markdown is handled by
      # markdownlint-cli2. Explicit globs are required: a bare directory
      # positional arg scans non-Markdown files.
      - run: bun run lint:docs

  markdown-lint-other:
    name: Markdown lint (other — markdownlint-cli2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # Lints all Markdown files that are NOT under OFM docs roots, .github/,
      # node_modules/, or generated extension test fixtures. Those directories
      # are handled separately or skipped.
      - run: bunx markdownlint-cli2 "**/*.md" "!docs/**" "!website/docs/**" "!.github/**" "!node_modules/**" "!extension/node_modules/**" "!extension/.vscode-test/**"

  website-checks:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Upload website build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-dist
          path: website/dist/

  extension-checks:
    name: Extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .

      - run: bun run build:binary
        working-directory: .

      - run: bun run build:binary:win
        working-directory: .

      - run: npm ci

      - run: npm run compile

      - run: npm test

      - run: npm run verify:marketplace-assets

      - run: npm run verify:package-targets

      - run: xvfb-run -a npm run test:host

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Only run on release tag pushes, not branch pushes or PRs.
    # Test tags use npm's native dry-run mode below.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [typecheck, lint, dependency-policy, test, bdd, build, markdown-lint-docs, markdown-lint-other, format, website-checks, extension-checks]
    environment: npm-publish
    # id-token: write is required for OIDC trusted publishing (keyless).
    # No NPM_TOKEN secret is needed — npm exchanges the OIDC token for a
    # short-lived publish credential. See ADR 008.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile --ignore-scripts

      # Node 24 LTS. The Node version used to publish does not affect the LSP
      # artifact — the package is compiled by Bun/tsc; Node is only needed to
      # drive npm.
      #
      # Do NOT set registry-url here: setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and
      # npm treats an explicitly-keyed empty token as "auth configured but
      # invalid", blocking the OIDC exchange. Without registry-url the
      # _authToken key is absent and npm performs the OIDC exchange itself.
      # npmjs.com is already the default registry.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      # Bootstrap a pinned npm release from the registry tarball instead of using
      # `npm install -g npm@<version>`. Fetching via curl/jq and running the
      # extracted CLI directly via `node` avoids depending on the runner image's
      # bundled npm before npm is installed. npm 9.5.0+ is
      # required for tokenless OIDC Trusted Publishing.
      - name: Bootstrap npm 11.14.0 (required for tokenless OIDC Trusted Publishing)
        run: |
          TMPDIR=$(mktemp -d)
          curl -sf "$(curl -sf https://registry.npmjs.org/npm/11.14.0 | jq -r '.dist.tarball')" \
            | tar -xz --strip-components=1 -C "$TMPDIR"
          node "$TMPDIR/bin/npm-cli.js" install -g npm@11.14.0 --ignore-scripts
          rm -rf "$TMPDIR"

      - run: bun run build

      - name: Publish to npmjs.com
        # --access public is required for the first publish of a new package;
        # omitting it causes npm to return E404 even for unscoped packages.
        # Bun registry is not targeted — it lacks OIDC support (oven-sh/bun#22423)
        # and packages on npmjs.org are installable via `bun add` regardless.
        run: |
          if [[ "$GITHUB_REF_NAME" == *-test* ]]; then
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
