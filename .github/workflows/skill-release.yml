name: Skill Release

on:
  push:
    tags: ['v*.*.*', 'v*.*.*-test*']
  workflow_dispatch:
    inputs:
      server_release:
        description: Server release tag to embed, or latest.
        type: string
        default: latest
      plugin_version:
        description: Plugin version for workflow_dispatch runs.
        type: string
        default: 0.7.1

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.13'
  COSIGN_VERSION: '3.0.6'

jobs:
  build-skill-artifacts:
    name: Build skill artifact (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            archive_ext: tar.gz
          - target: darwin-arm64
            archive_ext: tar.gz
          - target: darwin-x64
            archive_ext: tar.gz
          - target: win-x64
            archive_ext: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Set plugin version
        shell: bash
        env:
          INPUT_PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            plugin_version="${GITHUB_REF_NAME#v}"
          else
            plugin_version="$INPUT_PLUGIN_VERSION"
          fi
          bun run skill:set-version -- "$plugin_version"

      - run: bun run skill:test

      - run: bun run skill:marketplace:verify

      - run: bun run skill:plugin:verify

      - name: Install cosign
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="cosign-linux-amd64"; binary="cosign" ;;
            macOS-X64) asset="cosign-darwin-amd64"; binary="cosign" ;;
            macOS-ARM64) asset="cosign-darwin-arm64"; binary="cosign" ;;
            Windows-X64) asset="cosign-windows-amd64.exe"; binary="cosign.exe" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          install_dir="${RUNNER_TEMP}/cosign"
          mkdir -p "$install_dir"
          base_url="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSLo "${install_dir}/${binary}" "${base_url}/${asset}"
          curl -fsSLo "${install_dir}/cosign_checksums.txt" "${base_url}/cosign_checksums.txt"
          expected_sha256="$(grep "  ${asset}$" "${install_dir}/cosign_checksums.txt" | awk '{print $1}')"
          actual_sha256="$(COSIGN_BINARY="${install_dir}/${binary}" node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); console.log(crypto.createHash("sha256").update(fs.readFileSync(process.env.COSIGN_BINARY)).digest("hex"));')"
          test "$expected_sha256" = "$actual_sha256"
          chmod +x "${install_dir}/${binary}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Fetch signed server runtime
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_RELEASE: ${{ inputs.server_release }}
          TARGET: ${{ matrix.target }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            server_release="$GITHUB_REF_NAME"
          else
            server_release="$SERVER_RELEASE"
          fi
          if [[ -z "$server_release" ]]; then
            server_release="latest"
          fi

          for attempt in {1..120}; do
            if bun run skill:fetch-runtime -- \
              --target "$TARGET" \
              --server-release "$server_release" \
              --repo "$REPOSITORY"; then
              exit 0
            fi

            echo "Signed server runtime for ${server_release}/${TARGET} is not available yet; retry ${attempt}/120."
            sleep 15
          done

          bun run skill:fetch-runtime -- \
            --target "$TARGET" \
            --server-release "$server_release" \
            --repo "$REPOSITORY"

      - name: Stamp embedded server version
        shell: bash
        env:
          INPUT_PLUGIN_VERSION: ${{ inputs.plugin_version }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            plugin_version="${GITHUB_REF_NAME#v}"
          else
            plugin_version="$INPUT_PLUGIN_VERSION"
          fi
          if [[ "$TARGET" == "win-x64" ]]; then
            provenance="dist/flavor-grenade-lsp.exe.runtime.json"
          else
            provenance="dist/flavor-grenade-lsp.runtime.json"
          fi
          server_release_tag="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).releaseTag)" "$provenance")"
          server_version="${server_release_tag#v}"
          bun run skill:set-version -- "$plugin_version" \
            --server-version "$server_version" \
            --server-release-tag "$server_release_tag"

      - name: Package skill artifact
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          package_root="$(bun run skill:package -- --dry-run --require-signed-runtime --target "$TARGET" | tail -n 1)"
          node scripts/skill-verify.mjs --skill-root "$package_root/skills/flavorgrenade-lsp"
          echo "package_root=$package_root" >> "$GITHUB_OUTPUT"

      - name: Archive skill artifact
        id: archive
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          PACKAGE_ROOT: ${{ steps.package.outputs.package_root }}
        run: |
          mkdir -p build/skill-release
          package_root="$PACKAGE_ROOT"
          package_name="$(basename "$package_root")"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            (cd "$(dirname "$package_root")" && zip -qr "$GITHUB_WORKSPACE/build/skill-release/$package_name.zip" "$package_name")
            archive_path="build/skill-release/$package_name.zip"
          else
            tar -C "$(dirname "$package_root")" -czf "build/skill-release/$package_name.tar.gz" "$package_name"
            archive_path="build/skill-release/$package_name.tar.gz"
          fi
          sha256sum "$archive_path" > "$archive_path.sha256"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Sign archive with GitHub OIDC
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
        run: |
          archive_path="$ARCHIVE_PATH"
          cosign sign-blob "$archive_path" \
            --bundle "$archive_path.sigstore.json" \
            --yes

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flavorgrenade-lsp-skill-${{ matrix.target }}
          path: |
            build/skill-release/*
          if-no-files-found: error

  create-skill-release:
    name: Attach skill artifacts to GitHub release
    runs-on: ubuntu-latest
    needs: build-skill-artifacts
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: flavorgrenade-lsp-skill-*
          path: skill-release
          merge-multiple: true

      - name: Attach skill artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in {1..120}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" skill-release/* --clobber
              exit 0
            fi

            echo "GitHub Release ${GITHUB_REF_NAME} is not available yet; retry ${attempt}/120."
            sleep 15
          done

          gh release view "$GITHUB_REF_NAME"
