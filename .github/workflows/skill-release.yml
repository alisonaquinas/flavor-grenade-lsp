name: Skill Release

on:
  push:
    tags: ['skill-v*.*.*', 'skill-v*.*.*-test*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign artifacts without publishing a release.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-skill-artifacts:
    name: Build skill artifact (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            bun_target: bun-linux-x64
            binary_name: flavor-grenade-lsp
            archive_ext: tar.gz
          - target: darwin-arm64
            bun_target: bun-darwin-arm64
            binary_name: flavor-grenade-lsp
            archive_ext: tar.gz
          - target: darwin-x64
            bun_target: bun-darwin-x64
            binary_name: flavor-grenade-lsp
            archive_ext: tar.gz
          - target: win-x64
            bun_target: bun-windows-x64
            binary_name: flavor-grenade-lsp.exe
            archive_ext: zip
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'
          no-cache: true

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run skill:test

      - run: bun run skill:marketplace:verify

      - run: bun run skill:plugin:verify

      - name: Build native LSP runtime
        run: |
          node scripts/build-binary.mjs \
            --target=${{ matrix.bun_target }} \
            --outfile=dist/${{ matrix.binary_name }}

      - name: Package skill artifact
        id: package
        run: |
          package_root="$(bun run skill:package -- --dry-run --target ${{ matrix.target }} | tail -n 1)"
          node scripts/skill-verify.mjs --skill-root "$package_root/skills/flavorgrenade-lsp"
          echo "package_root=$package_root" >> "$GITHUB_OUTPUT"

      - name: Archive skill artifact
        id: archive
        run: |
          mkdir -p build/skill-release
          package_root="${{ steps.package.outputs.package_root }}"
          package_name="$(basename "$package_root")"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd "$(dirname "$package_root")" && zip -qr "$GITHUB_WORKSPACE/build/skill-release/$package_name.zip" "$package_name")
            archive_path="build/skill-release/$package_name.zip"
          else
            tar -C "$(dirname "$package_root")" -czf "build/skill-release/$package_name.tar.gz" "$package_name"
            archive_path="build/skill-release/$package_name.tar.gz"
          fi
          sha256sum "$archive_path" > "$archive_path.sha256"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign archive with GitHub OIDC
        run: |
          archive_path="${{ steps.archive.outputs.archive_path }}"
          cosign sign-blob "$archive_path" \
            --bundle "$archive_path.sigstore.json" \
            --yes

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flavorgrenade-lsp-skill-${{ matrix.target }}
          path: |
            build/skill-release/*
          if-no-files-found: error

  create-skill-release:
    name: Create skill GitHub release
    runs-on: ubuntu-latest
    needs: build-skill-artifacts
    if: startsWith(github.ref, 'refs/tags/skill-v') && !contains(github.ref_name, '-test')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: flavorgrenade-lsp-skill-*
          path: skill-release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" skill-release/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Flavor Grenade LSP skill release $GITHUB_REF_NAME"
